<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repeat Contact | Case workspace</title>
<style>
:root{--ink:#172b40;--muted:#68798c;--line:#e3eaf0;--bg:#f3f6fa;--brand:#087f78;--nav:#102b37;--shadow:0 6px 22px #182e4010}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit;border:1px solid #d5dfe7;border-radius:9px;padding:10px 13px;background:white}
button{cursor:pointer;font-weight:600;transition:background .15s}button:hover:not(:disabled){background:#edf5f5}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3bbcac70;outline-offset:2px}
.primary{background:var(--brand);border-color:var(--brand);color:white}.primary:hover:not(:disabled){background:#066a64}.danger{color:#b42318;border-color:#efc3c0}
h1,h2,h3,p{margin-top:0}h1{font-size:27px;letter-spacing:-.7px;margin-bottom:6px}h2{font-size:21px}small,.muted{color:var(--muted)}
.topbar{padding:18px 28px;background:var(--nav);color:white;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.monogram{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#ffffff16;color:#70e1cc;font-weight:800}
.brand strong{display:block;font-size:17px}.brand small{color:#b6cbd5;font-size:12px}.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.topbar button{background:#ffffff12;color:white;border-color:#ffffff30}.topbar button:hover:not(:disabled){background:#ffffff22}
#account{color:#d9e8ee;font-size:12px;max-width:460px;overflow-wrap:anywhere}.shell{max-width:1600px;margin:auto;padding:28px}
.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:22px}.eyebrow{color:var(--brand);text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:800;margin-bottom:8px}
.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}.panel-pad{padding:23px}
.tabs{display:flex;gap:6px;padding:6px;background:#e8eef3;border-radius:12px;width:max-content;max-width:100%;flex-wrap:wrap;margin-bottom:20px}.tabs button{border:0;background:transparent;color:var(--muted);padding:11px 18px}.tabs button.active{background:white;color:var(--ink);box-shadow:0 2px 7px #102b3710}.tab-count{font-size:11px;background:#e9f0f4;padding:2px 7px;border-radius:20px;margin-left:5px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.card{padding:19px 21px;border:1px solid var(--line);border-radius:13px;background:white;box-shadow:var(--shadow);position:relative}.card:before{content:"";display:block;position:absolute;left:0;top:20px;bottom:20px;width:3px;border-radius:4px;background:var(--accent,#087f78)}.card-label{color:var(--muted);font-size:12px}.card strong{display:block;font-size:30px;letter-spacing:-1px;margin:7px 0}.card small{font-size:11px}
.filters{padding:18px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}#search{flex:1;min-width:230px}.list-heading{padding:17px 21px;display:flex;align-items:center;justify-content:space-between;gap:10px}.list-heading h2{font-size:15px;margin:0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;background:#f7f9fc;color:#718194;font-size:10px;letter-spacing:.7px;padding:13px 16px;white-space:nowrap}td{padding:16px;border-bottom:1px solid #edf1f5;vertical-align:middle;font-size:12px}tbody tr.case-row:hover{background:#fcfefe}td.customer{min-width:200px;max-width:280px;overflow-wrap:anywhere}.customer strong{display:block;font-size:12px;margin-bottom:5px}.customer small{display:block}.date-cell{white-space:nowrap}.assignee{max-width:170px;overflow-wrap:anywhere}.latest{min-width:130px;max-width:240px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}.latest:empty:after{content:"—"}.row-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:225px}.row-actions button{font-size:11px;padding:8px 10px}.row-actions .assign-button{color:var(--brand);background:#effaf7;border-color:#cfe9e2}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:750;white-space:nowrap}.badge:before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}.s-open{background:#eaf1ff;color:#3465ba}.s-follow-up{background:#fff5df;color:#9b6c0d}.s-resolved{background:#e6f7ef;color:#16784b}.s-closed{background:#edf0f4;color:#647384}.channel{font-size:10px;letter-spacing:.5px;font-weight:800;color:#6b7e90}
.details-cell{padding:20px;background:#f7fafc}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.detail-item{min-width:0;overflow-wrap:anywhere}.detail-item small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}.detail-item div{font-size:12px;line-height:1.6;white-space:pre-wrap}.wide{grid-column:1/-1}.footer{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pager{display:flex;gap:8px;align-items:center}.pager button{font-size:11px;padding:7px 10px}.empty{text-align:center;padding:50px!important;color:var(--muted)}
#status{white-space:pre-line;overflow-wrap:anywhere;line-height:1.6;margin-bottom:18px;font-size:13px}#status:not(:empty){background:#e8f6ef;border:1px solid #cce7d9;border-radius:10px;padding:12px 16px}#status.error{background:#fff0ee;border-color:#f1cfca;color:#a33329}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:grid;gap:7px;font-size:12px;font-weight:650}input,select,textarea{min-width:0}label small{font-weight:400;line-height:1.6}.notice{padding:14px 16px;border-radius:10px;background:#fff8e9;border:1px solid #efdfba;font-size:12px;line-height:1.7;margin:16px 0}.error{color:#b42318}.user-actions{display:flex;gap:6px;flex-wrap:wrap}.user-actions button{padding:7px 9px;font-size:11px}
#login{max-width:470px;margin:9vh auto;padding:32px;background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}#login h1{font-size:25px}#login input,#login button{width:100%;margin-bottom:12px}#loginStatus{white-space:pre-line;line-height:1.6;font-size:12px}#login .monogram{background:var(--nav);margin-bottom:20px}.separator{text-align:center;font-size:12px;color:var(--muted);margin:18px 0}
dialog{width:min(720px,95vw);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:17px;padding:26px;box-shadow:0 24px 100px #0c263140}dialog::backdrop{background:#0d26356b;backdrop-filter:blur(3px)}dialog h2{margin-bottom:7px}dialog p{line-height:1.7}dialog select,dialog textarea,dialog input{width:100%}dialog textarea{min-height:120px;resize:vertical}.modal-info{padding:16px;background:#f5f8fb;border-radius:10px;margin:17px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:12px}.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.remark-block{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.timeline-entry{padding:16px 0;border-bottom:1px solid var(--line)}.timeline-entry small{display:block;margin-bottom:6px}.timeline-entry strong{display:block;font-size:12px;margin-bottom:7px}.timeline-entry p{margin:6px 0 0;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:900px){.shell{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:16px}}
@media(max-width:550px){.grid,.detail-grid{grid-template-columns:1fr}.shell{padding:12px}.heading{margin-top:10px}h1{font-size:23px}.tabs{width:100%}.tabs button{flex:1;padding:10px}.filters{padding:13px}.filters>*{flex:1}.card{padding:15px}.card strong{font-size:26px}#login{margin:20px 12px}.top-actions{width:100%}#account{flex:1}dialog{padding:20px}}
</style>
</head>
<body>
<section id="login">
  <div class="monogram">RC</div><h1>Repeat Contact</h1><p class="muted">Sign in to your case workspace.</p>
  <button id="google" class="primary" disabled>Loading sign-in…</button>
  <div class="separator">or use your assigned Login ID</div>
  <form id="passwordLogin"><input id="loginId" placeholder="Login ID" autocomplete="username" required><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required><button id="passwordButton" disabled>Sign in</button></form>
  <p id="loginStatus" role="status" aria-live="polite"></p><button id="switchAccount" hidden>Sign out / use another account</button>
</section>
<div id="app" hidden>
<header class="topbar">
  <div class="brand"><div class="monogram">RC</div><div><strong>Repeat Contact</strong><small>Customer support workspace</small></div></div>
  <div class="top-actions"><div id="account"></div><button id="refresh">Refresh</button><button id="logout">Sign out</button></div>
</header>
<main class="shell">

    <button id="usersTab" hidden>User management</button>
  </nav>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="casesSection">
    <div id="cards" class="cards"></div>
    <section class="panel">
